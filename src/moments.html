<include src="partials/layout.html">
  <template name="head">
    <title th:text="|${title} - ${site.title}|">瞬间</title>
    <style>
      .moments > nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1.5rem 0;
      }
      .moments > nav a {
        color: var(--color-link);
      }
      .moments > nav a:hover {
        color: var(--color-link-hover);
      }
      .moments > ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .moments article {
        padding: 1.5rem 0;
        border-bottom: 1px solid var(--color-border);
      }
      .moments article header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
        opacity: 0.75;
        color: var(--color-text-secondary);
      }
      .moments article header > a {
        display: inline-flex;
        align-items: center;
        line-height: 2rem;
      }
      .moments .moment-owner {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .moments .moment-owner img {
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        object-fit: cover;
      }
      .moments .moment-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        font-size: 0.85rem;
      }
      .moments .moment-tags a {
        color: var(--color-link);
      }
      .moments .moment-media img,
      .moments .moment-media video {
        display: block;
        max-width: 100%;
        height: auto;
        margin-top: 1rem;
        border-radius: var(--radius-md);
      }
      .moments .moment-media audio {
        width: 100%;
        margin-top: 1rem;
      }
    </style>
  </template>

  <div class="container">
    <section class="moments">
      <h1 th:text="${title}">瞬间</h1>

      <nav th:if="${not #lists.isEmpty(tags)}" aria-label="瞬间标签">
        <a th:href="@{/moments}">全部</a>
        <a
          th:each="tag : ${tags}"
          th:href="@{${tag.permalink}}"
          th:text="|${tag.name} (${tag.momentCount})|"
        ></a>
      </nav>

      <ul th:if="${not #lists.isEmpty(moments.items)}">
        <li th:each="moment : ${moments.items}">
          <article th:with="content=${moment.spec.content}">
            <header>
              <span class="moment-owner" th:if="${moment.owner != null}">
                <img
                  th:if="${not #strings.isEmpty(moment.owner.avatar)}"
                  th:src="${moment.owner.avatar}"
                  alt=""
                  loading="lazy"
                />
                <span th:text="${moment.owner.displayName}">用户名</span>
              </span>
              <a th:href="@{/moments/{name}(name=${moment.metadata.name})}">
                <time
                  th:if="${moment.spec.releaseTime != null}"
                  th:datetime="${moment.spec.releaseTime}"
                  th:text="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd HH:mm')}"
                  >发布时间</time
                >
              </a>
              <th:block th:if="${pluginFinder.available('extra-api') and content != null}">
                <span
                  class="moment-words"
                  th:with="wc=${extraApiStatsFinder.getContentWordCount(content.html)}"
                  th:if="${wc != null and wc > 0}"
                  th:text="#{post.words(${wc})}"
                  >字数</span
                >
              </th:block>
            </header>

            <div
              class="moment-tags"
              th:if="${not #lists.isEmpty(moment.spec.tags)}"
            >
              <a
                th:each="tag : ${moment.spec.tags}"
                th:href="@{/moments(tag=${tag})}"
                th:text="'#' + ${tag}"
              ></a>
            </div>

            <div
              th:if="${not #strings.isEmpty(content.html)}"
              th:attr="data-lightbox=${theme.config?.basic?.enable_lightbox != false ? 'true' : null}"
              th:utext="${content.html}"
            ></div>

            <div
              class="moment-media"
              th:attr="data-lightbox=${theme.config?.basic?.enable_lightbox != false ? 'true' : null}"
              th:if="${not #lists.isEmpty(content.medium)}"
            >
              <th:block th:each="medium : ${content.medium}">
                <img
                  th:if="${medium.type.name == 'PHOTO'}"
                  th:src="${medium.url}"
                  alt="瞬间图片"
                  loading="lazy"
                />
                <video
                  th:if="${medium.type.name == 'VIDEO'}"
                  th:src="${medium.url}"
                  controls
                ></video>
                <audio
                  th:if="${medium.type.name == 'AUDIO'}"
                  th:src="${medium.url}"
                  controls
                ></audio>
              </th:block>
            </div>
          </article>
        </li>
      </ul>
      <p th:if="${#lists.isEmpty(moments.items)}">暂无瞬间</p>

      <nav
        th:if="${moments.hasPrevious() or moments.hasNext()}"
        aria-label="瞬间分页"
      >
        <a th:if="${moments.hasPrevious()}" th:href="@{${moments.prevUrl}}">上一页</a>
        <span th:text="${moments.page}">1</span>
        <a th:if="${moments.hasNext()}" th:href="@{${moments.nextUrl}}">下一页</a>
      </nav>
    </section>
  </div>
</include>
