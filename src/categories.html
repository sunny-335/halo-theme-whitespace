<include src="partials/layout.html">
  <template name="head">
    <title th:text="|#{categories.title} - ${site.title}|">Categories</title>
    <th:block
      th:with="seoTitle=#{categories.title}, seoUrl=${site.url + site.routes.categoriesUri}, seoDesc=null, seoImage=${site.logo}, seoType='website'"
    >
      <include src="seo.html"></include>
    </th:block>
  </template>

  <div class="container">
    <div class="category-header">
      <h1 class="category-title" th:text="#{categories.title}">
        Categories
      </h1>
    </div>

    <div class="category-list" th:if="${not #lists.isEmpty(categories)}">
      <th:block
        th:replace="~{modules/category-tree :: category-tree(cats=${categories})}"
      ></th:block>
    </div>

    <div class="no-results" th:if="${#lists.isEmpty(categories)}">
      <p th:text="#{list.empty}">Nothing found here.</p>
    </div>
  </div>
</include>
