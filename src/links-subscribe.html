<include src="partials/layout.html">
  <template name="head">
    <title
      th:text="|${singlePage.spec.title} - ${site.title}|"
      th:if="${singlePage != null}"
    >
      链接订阅
    </title>
    <style>
      .feed-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .feed-item {
        padding: 1.25rem 0;
        border-bottom: 1px solid var(--color-border);
      }
      .feed-item-title {
        font-size: 1.05rem;
        font-weight: 600;
      }
      .feed-item-title a {
        color: var(--color-link);
      }
      .feed-item-meta {
        margin: 0.35rem 0;
        font-size: 0.8rem;
        color: var(--color-text-muted);
      }
      .feed-item-author {
        color: var(--color-text-secondary);
        transition: color var(--transition-fast);
      }
      .feed-item-author:hover {
        color: var(--color-primary);
      }
      .feed-item-sep {
        color: var(--color-border);
        margin: 0 0.3rem;
      }
      .feed-item-summary {
        margin: 0.5rem 0 0;
        color: var(--color-text-secondary);
        line-height: 1.7;
        display: -webkit-box;
        -webkit-line-clamp: 5;
        line-clamp: 5;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </template>

  <div class="container">
    <section class="feed">
      <h1 th:text="${singlePage.spec.title}" th:if="${singlePage != null}">链接订阅</h1>
      <p
        class="feed-intro"
        th:if="${singlePage.status?.excerpt != null}"
        th:utext="${singlePage.status.excerpt}"
      ></p>

      <div
        th:if="${linkFeedFinder != null}"
        th:with="feedPage=${linkFeedFinder.list({limit: 30})}"
      >
        <ul th:if="${not #lists.isEmpty(feedPage.items)}" class="feed-list">
          <li class="feed-item" th:each="item : ${feedPage.items}">
            <div class="feed-item-title">
              <a th:href="@{${item.url}}" target="_blank" rel="noopener noreferrer">
                <span th:text="${item.title}">标题</span>
              </a>
            </div>
            <p class="feed-item-meta">
              <th:block
                th:if="${item.author != null and item.author != ''}"
              >
                <a
                  th:if="${item.authorUrl != null and item.authorUrl != ''}"
                  class="feed-item-author"
                  th:href="@{${item.authorUrl}}"
                  target="_blank"
                  rel="noopener noreferrer"
                  th:text="${item.author}"
                  >作者</a
                >
                <span
                  th:unless="${item.authorUrl != null and item.authorUrl != ''}"
                  class="feed-item-author"
                  th:text="${item.author}"
                  >作者</span
                >
                <span
                  th:if="${item.publishedAt != null}"
                  class="feed-item-sep"
                  >·</span
                >
              </th:block>
              <span
                th:if="${item.publishedAt != null}"
                th:with="pt=${item.publishedAt}"
              >
                <time
                  th:datetime="${pt}"
                  th:text="${#temporals.format(pt, 'yyyy-MM-dd HH:mm')}"
                  >时间</time
                ></span
              >
            </p>
            <p
              class="feed-item-summary"
              th:if="${not #strings.isEmpty(item.summary)}"
              th:utext="${item.summary}"
            ></p>
          </li>
        </ul>
        <p th:if="${#lists.isEmpty(feedPage.items)}" class="no-results">
          暂无订阅动态。请在 plugin-links 设置中开启「公开 RSS 订阅动态」。
        </p>
      </div>

      <p
        class="no-results"
        th:if="${linkFeedFinder == null}"
      >
        未检测到 plugin-links，无法加载订阅动态。
      </p>
    </section>
  </div>
</include>
