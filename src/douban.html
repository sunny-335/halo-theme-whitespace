<include src="partials/layout.html">
  <template name="head">
    <title
      th:text="|${singlePage.spec.title} - ${site.title}|"
      th:if="${singlePage != null}"
    >
      豆瓣
    </title>
    <style>
      .douban-intro {
        color: var(--color-text-secondary);
        margin-bottom: 1.5rem;
        line-height: 1.7;
      }
      .douban-section {
        margin: 2rem 0;
      }
      .douban-section-title {
        font-size: 1.15rem;
        margin: 0 0 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--color-border);
      }
      .douban-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
        gap: 1.25rem;
      }
      .douban-card {
        display: block;
        color: var(--color-text);
      }
      .douban-card:hover .douban-name {
        color: var(--color-primary);
      }
      .douban-cover {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: var(--radius-md);
        background: var(--color-bg-secondary);
      }
      .douban-name {
        margin: 0.5rem 0 0;
        font-size: 0.9rem;
        font-weight: 600;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .douban-meta {
        margin: 0.25rem 0 0;
        font-size: 0.78rem;
        color: var(--color-text-muted);
      }
      .douban-score {
        color: var(--color-primary);
        font-weight: 600;
        margin-left: 0.4rem;
      }
      .douban-empty {
        color: var(--color-text-muted);
        padding: 2rem 0;
      }
    </style>
  </template>

  <div class="container">
    <section class="douban">
      <h1 th:text="${singlePage.spec.title}" th:if="${singlePage != null}">
        豆瓣
      </h1>
      <p
        class="douban-intro"
        th:if="${singlePage.status?.excerpt != null}"
        th:utext="${singlePage.status.excerpt}"
      ></p>

      <th:block th:if="${pluginFinder.available('plugin-douban')}">
        <!-- 读过 -->
        <th:block
          th:with="res=${doubanFinder.list(1, 24, 'book', 'done')}, movies=${res != null ? res.items : null}"
        >
          <div
            class="douban-section"
            th:if="${not #lists.isEmpty(movies)}"
          >
            <h2 class="douban-section-title">读过</h2>
            <div class="douban-grid">
              <a
                th:each="m : ${movies}"
                class="douban-card"
                th:href="${m.link}"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  class="douban-cover"
                  th:src="${m.poster}"
                  th:alt="${m.name}"
                  loading="lazy"
                  decoding="async"
                />
                <p class="douban-name" th:text="${m.name}">名称</p>
                <p class="douban-meta">
                  <span
                    th:if="${not #strings.isEmpty(m.year)}"
                    th:text="${m.year}"
                    >年份</span
                  >
                  <span
                    th:if="${not #strings.isEmpty(m.score)}"
                    class="douban-score"
                    th:text="'★ ' + ${m.score}"
                    >评分</span
                  >
                </p>
              </a>
            </div>
          </div>
        </th:block>

        <!-- 在读 -->
        <th:block
          th:with="res=${doubanFinder.list(1, 24, 'book', 'doing')}, movies=${res != null ? res.items : null}"
        >
          <div
            class="douban-section"
            th:if="${not #lists.isEmpty(movies)}"
          >
            <h2 class="douban-section-title">在读</h2>
            <div class="douban-grid">
              <a
                th:each="m : ${movies}"
                class="douban-card"
                th:href="${m.link}"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  class="douban-cover"
                  th:src="${m.poster}"
                  th:alt="${m.name}"
                  loading="lazy"
                  decoding="async"
                />
                <p class="douban-name" th:text="${m.name}">名称</p>
                <p class="douban-meta">
                  <span
                    th:if="${not #strings.isEmpty(m.year)}"
                    th:text="${m.year}"
                    >年份</span
                  >
                  <span
                    th:if="${not #strings.isEmpty(m.score)}"
                    class="douban-score"
                    th:text="'★ ' + ${m.score}"
                    >评分</span
                  >
                </p>
              </a>
            </div>
          </div>
        </th:block>

        <!-- 看过 -->
        <th:block
          th:with="res=${doubanFinder.list(1, 24, 'movie', 'done')}, movies=${res != null ? res.items : null}"
        >
          <div
            class="douban-section"
            th:if="${not #lists.isEmpty(movies)}"
          >
            <h2 class="douban-section-title">看过</h2>
            <div class="douban-grid">
              <a
                th:each="m : ${movies}"
                class="douban-card"
                th:href="${m.link}"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  class="douban-cover"
                  th:src="${m.poster}"
                  th:alt="${m.name}"
                  loading="lazy"
                  decoding="async"
                />
                <p class="douban-name" th:text="${m.name}">名称</p>
                <p class="douban-meta">
                  <span
                    th:if="${not #strings.isEmpty(m.year)}"
                    th:text="${m.year}"
                    >年份</span
                  >
                  <span
                    th:if="${not #strings.isEmpty(m.score)}"
                    class="douban-score"
                    th:text="'★ ' + ${m.score}"
                    >评分</span
                  >
                </p>
              </a>
            </div>
          </div>
        </th:block>

        <!-- 在追 -->
        <th:block
          th:with="res=${doubanFinder.list(1, 24, 'drama', 'doing')}, movies=${res != null ? res.items : null}"
        >
          <div
            class="douban-section"
            th:if="${not #lists.isEmpty(movies)}"
          >
            <h2 class="douban-section-title">在追</h2>
            <div class="douban-grid">
              <a
                th:each="m : ${movies}"
                class="douban-card"
                th:href="${m.link}"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  class="douban-cover"
                  th:src="${m.poster}"
                  th:alt="${m.name}"
                  loading="lazy"
                  decoding="async"
                />
                <p class="douban-name" th:text="${m.name}">名称</p>
                <p class="douban-meta">
                  <span
                    th:if="${not #strings.isEmpty(m.year)}"
                    th:text="${m.year}"
                    >年份</span
                  >
                  <span
                    th:if="${not #strings.isEmpty(m.score)}"
                    class="douban-score"
                    th:text="'★ ' + ${m.score}"
                    >评分</span
                  >
                </p>
              </a>
            </div>
          </div>
        </th:block>
      </th:block>

      <p
        class="douban-empty"
        th:if="${pluginFinder.available('plugin-douban') == false}"
        th:text="#{douban.plugin_required}"
      >
        未检测到豆瓣插件
      </p>
    </section>
  </div>
</include>
