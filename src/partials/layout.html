<!doctype html>
<html
  lang="zh-CN"
  xmlns:th="https://www.thymeleaf.org"
  th:lang="${#locale.toLanguageTag}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <slot name="head">
      <title th:text="${site.title}">Site Title</title>
    </slot>
    <script th:inline="javascript">
      (function () {
        var preferred = /*[[${theme.config?.basic?.color_scheme ?: 'system'}]]*/ "system";
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {
          /* ignore */
        }
        var resolved = stored || preferred;
        if (resolved === "system") {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", resolved);
      })();
    </script>
    <script type="module" src="/js/main.ts"></script>
  </head>
  <body>
    <!-- 头部导航 -->
    <header class="header">
      <div class="header-inner">
        <a th:href="@{/}" class="logo">
          <img
            th:if="${not #strings.isEmpty(site.logo)}"
            th:src="${site.logo}"
            th:alt="${site.title}"
            class="logo-img"
          />
          <span
            th:if="${#strings.isEmpty(site.logo)}"
            class="logo-text"
            th:text="${site.title}"
            >Site Title</span
          >
        </a>
        <nav class="nav">
          <th:block th:with="primaryMenu = ${menuFinder.getPrimary()}">
            <a
              th:if="${primaryMenu == null}"
              class="nav-link"
              th:href="@{/}"
              th:text="#{nav.home}"
              >Home</a
            >
            <th:block th:if="${primaryMenu != null}">
              <th:block th:each="item : ${primaryMenu.menuItems}">
                <th:block
                  th:if="${not #lists.isEmpty(item.children)}"
                >
                  <div class="nav-item nav-has-children">
                    <a
                      class="nav-link"
                      th:href="@{${item.status.href}}"
                      th:text="${item.status.displayName}"
                      th:target="${item.spec.target?.value}"
                    ></a>
                    <div class="nav-dropdown">
                      <a
                        th:each="child : ${item.children}"
                        class="nav-dropdown-link"
                        th:href="@{${child.status.href}}"
                        th:text="${child.status.displayName}"
                        th:target="${child.spec.target?.value}"
                      ></a>
                    </div>
                  </div>
                </th:block>
                <th:block th:unless="${not #lists.isEmpty(item.children)}">
                  <a
                    class="nav-link"
                    th:href="@{${item.status.href}}"
                    th:text="${item.status.displayName}"
                    th:target="${item.spec.target?.value}"
                  ></a>
                </th:block>
              </th:block>
            </th:block>
          </th:block>
        </nav>
        <div class="header-actions">
          <button
            class="btn-icon"
            id="theme-toggle"
            type="button"
            th:title="#{theme.toggle}"
          >
            <svg
              class="icon icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg
              class="icon icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button
            th:if="${pluginFinder.available('PluginSearchWidget')}"
            class="btn-icon"
            id="search-toggle"
            type="button"
            th:title="#{search.title}"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <button
            class="btn-icon mobile-menu-toggle"
            id="mobile-menu-toggle"
            type="button"
            th:title="#{mobile.menu}"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- 移动端导航菜单 -->
    <div class="mobile-nav" id="mobile-nav">
      <th:block th:with="primaryMenu = ${menuFinder.getPrimary()}">
        <a
          th:if="${primaryMenu == null}"
          class="mobile-nav-link"
          th:href="@{/}"
          th:text="#{nav.home}"
          >Home</a
        >
        <th:block th:if="${primaryMenu != null}">
          <th:block th:each="item : ${primaryMenu.menuItems}">
            <a
              class="mobile-nav-link"
              th:href="@{${item.status.href}}"
              th:text="${item.status.displayName}"
              th:target="${item.spec.target?.value}"
            ></a>
            <a
              th:each="child : ${item.children}"
              class="mobile-nav-link mobile-nav-sub"
              th:href="@{${child.status.href}}"
              th:text="${child.status.displayName}"
              th:target="${child.spec.target?.value}"
            ></a>
          </th:block>
        </th:block>
      </th:block>
    </div>

    <main class="main">
      <slot />
    </main>

    <!-- 页脚 -->
    <footer class="footer">
      <div class="container">
        <div
          class="footer-copyright"
          th:if="${not #strings.isEmpty(theme.config?.basic?.footer_copyright)}"
          th:utext="${theme.config.basic.footer_copyright}"
        ></div>
        <p
          class="footer-theme"
          th:if="${theme.config?.basic?.show_theme_credit != false}"
        >
          <a
            class="footer-theme-link"
            th:href="${theme.config?.basic?.theme_credit_url ?: 'https://git.nxxy335.top/nxxy335/halo-theme-whitespace'}"
            target="_blank"
            rel="noopener noreferrer"
            th:text="#{footer.theme(${theme.config?.basic?.theme_credit_text ?: 'WhiteSpace'})}"
            >Theme by WhiteSpace</a
          >
        </p>
        <div
          class="footer-beian"
          th:if="${not #strings.isEmpty(theme.config?.footer?.icp_number) or not #strings.isEmpty(theme.config?.footer?.police_number)}"
        >
          <a
            class="footer-beian-item"
            th:if="${not #strings.isEmpty(theme.config?.footer?.icp_number)}"
            th:href="${theme.config?.footer?.icp_url}"
            target="_blank"
            rel="noopener noreferrer"
            th:text="${theme.config?.footer?.icp_number}"
            >ICP</a
          >
          <a
            class="footer-beian-item footer-police"
            th:if="${not #strings.isEmpty(theme.config?.footer?.police_number)}"
            th:href="${theme.config?.footer?.police_url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              class="footer-police-icon"
              src="https://beian.mps.gov.cn/img/footerPoliceIcon.png"
              alt=""
              loading="lazy"
            />
            <span th:text="${theme.config?.footer?.police_number}">公网安备</span>
          </a>
        </div>
        <div
          class="footer-stats"
          th:if="${theme.config?.stats?.enable}"
          th:with="stats=${siteStatsFinder.getStats()}, tags=${tagFinder.listAll()}"
        >
          <span
            class="footer-stat"
            th:if="${theme.config?.stats?.show_posts}"
            th:text="#{stats.posts(${stats.post})}"
            >文章</span
          >
          <span
            class="footer-stat"
            th:if="${theme.config?.stats?.show_categories}"
            th:text="#{stats.categories(${stats.category})}"
            >分类</span
          >
          <span
            class="footer-stat"
            th:if="${theme.config?.stats?.show_tags and tags != null}"
            th:text="#{stats.tags(${#lists.size(tags)})}"
            >标签</span
          >
          <span
            class="footer-stat"
            th:if="${theme.config?.stats?.show_comments}"
            th:text="#{stats.comments(${stats.comment})}"
            >评论</span
          >
          <span
            class="footer-stat"
            th:if="${theme.config?.stats?.show_visits}"
            th:text="#{stats.visits(${stats.visit})}"
            >访问</span
          >
          <span
            class="footer-stat"
            th:if="${theme.config?.stats?.show_words and pluginFinder.available('extra-api')}"
            th:text="#{stats.words(${extraApiStatsFinder.getPostWordCount()})}"
            >字数</span
          >
        </div>
        <halo:footer />
      </div>
    </footer>

    <!-- 回到顶部 -->
    <button
      class="back-to-top"
      id="back-to-top"
      type="button"
      th:title="#{back.to.top}"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </body>
</html>
