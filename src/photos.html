<include src="partials/layout.html">
  <template name="head">
    <title th:text="|${title} - ${site.title}|">图库</title>
    <style>
      /* 图库页面适当加宽 */
      .container {
        max-width: 75rem;
      }
      :where(.photos-groups) {
        margin: 1.5rem 0;
      }
      :where(.photos-groups__list, .photos-grid, .photos-card__tags) {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      :where(.photos-groups__list, .photos-card__tags) {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      :where(.photos-group__link) {
        display: inline-flex;
        gap: 0.25rem;
        align-items: baseline;
        color: var(--color-link);
      }
      :where(.photos-group__link):hover {
        color: var(--color-link-hover);
      }
      :where(.photos-group.is-active .photos-group__link) {
        font-weight: 600;
      }

      /* 相册网格 */
      :where(.albums-grid) {
        list-style: none;
        margin: 1.5rem 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(
          auto-fill,
          minmax(min(16rem, 100%), 1fr)
        );
        gap: 1.5rem;
      }
      :where(.albums-card) {
        display: block;
        color: var(--color-text);
      }
      :where(.albums-card:hover .albums-card__name) {
        color: var(--color-primary);
      }
      :where(.albums-card__cover) {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border-radius: var(--radius-md);
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border);
      }
      :where(.albums-card__cover img) {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      :where(.albums-card__cover img.album-cover-custom) {
        z-index: 1;
      }
      :where(.albums-card__name) {
        margin: 0.75rem 0 0;
        font-size: 1rem;
        font-weight: 600;
      }
      :where(.albums-card__count) {
        margin: 0.25rem 0 0;
        font-size: 0.85rem;
        color: var(--color-text-muted);
      }
      :where(.albums-card__more) {
        display: inline-block;
        margin-top: 0.4rem;
        font-size: 0.8rem;
        color: var(--color-primary);
        opacity: 0;
        transform: translateX(-0.25rem);
        transition: opacity var(--transition-fast), transform var(--transition-fast);
      }
      :where(.albums-card:hover .albums-card__more) {
        opacity: 1;
        transform: translateX(0);
      }

      /* 瀑布流（一行三张） */
      :where(.photos-masonry) {
        list-style: none;
        margin: 1.5rem 0 0;
        padding: 0;
        columns: 3;
        column-gap: 1rem;
      }
      :where(.photos-masonry > li) {
        break-inside: avoid;
        margin: 0 0 1rem;
      }
      :where(.photos-masonry .photos-card__media) {
        display: block;
      }
      :where(.photos-masonry img) {
        display: block;
        width: 100%;
        height: auto;
        border-radius: var(--radius-md);
        background: var(--color-bg-secondary);
      }
      :where(.photos-masonry .photos-card__caption) {
        margin: 0.4rem 0 0;
        font-size: 0.85rem;
        color: var(--color-text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (max-width: 900px) {
        :where(.photos-masonry) {
          columns: 2;
        }
      }
      @media (max-width: 560px) {
        :where(.photos-masonry) {
          columns: 1;
        }
      }

      /* 预览模式切换 */
      :where(.photos-toolbar) {
        display: flex;
        justify-content: flex-end;
        margin-top: 1rem;
      }
      :where(.photos-preview-toggle) {
        padding: 0.4rem 0.9rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background: var(--color-bg-secondary);
        color: var(--color-text);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      :where(.photos-preview-toggle)[aria-pressed="true"] {
        border-color: var(--color-primary);
        color: var(--color-primary);
      }

      :where(.photos-empty) {
        color: var(--color-text-muted);
        padding: 2rem 0;
      }
      :where(.photos-pagination) {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        margin-top: 2rem;
      }
    </style>
  </template>

  <div class="container">
    <section class="photos-page">
      <header class="photos-header">
        <h1 class="photos-header__title" th:text="${title}">图库</h1>
      </header>

      <nav class="photos-groups" aria-label="照片分组">
        <ul class="photos-groups__list">
          <li
            class="photos-group"
            th:classappend="${#strings.isEmpty(group)} ? 'is-active' : ''"
          >
            <a
              class="photos-group__link"
              th:href="${photoUrl.list()}"
              th:attr="aria-current=${#strings.isEmpty(group) ? 'page' : null}"
              >全部相册</a
            >
          </li>
          <li
            class="photos-group"
            th:each="photoGroup : ${groups}"
            th:classappend="${group == photoGroup.metadata.name} ? 'is-active' : ''"
          >
            <a
              class="photos-group__link"
              th:href="${photoUrl.list(photoGroup.metadata.name)}"
              th:attr="aria-current=${group == photoGroup.metadata.name ? 'page' : null}"
            >
              <span
                class="photos-group__name"
                th:text="${photoGroup.spec.displayName}"
                >相册</span
              >
              <span
                class="photos-group__count"
                th:if="${photoGroup.status != null and photoGroup.status.photoCount != null}"
                th:text="|(${photoGroup.status.photoCount})|"
              ></span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- 相册视图：按分组展示各相册 -->
      <th:block th:if="${#strings.isEmpty(group)}">
        <th:block th:with="albums=${photoFinder.groupBy()}">
          <ul class="albums-grid" th:if="${not #lists.isEmpty(albums)}">
            <li th:each="album : ${albums}">
              <a
                class="albums-card"
                th:href="${photoUrl.list(album.metadata.name)}"
                th:aria-label="|查看相册 ${album.spec.displayName}|"
                th:title="|查看相册 ${album.spec.displayName}|"
              >
                <span class="albums-card__cover">
                  <th:block th:with="rawPhotos=${album.photos}">
                    <img
                      th:if="${rawPhotos != null and !#lists.isEmpty(rawPhotos)}"
                      th:src="${rawPhotos[0].spec.cover != null and !#strings.isEmpty(rawPhotos[0].spec.cover) ? rawPhotos[0].spec.cover : rawPhotos[0].spec.url}"
                      th:alt="${album.spec.displayName}"
                      loading="lazy"
                    />
                    <th:block
                      th:unless="${rawPhotos != null and !#lists.isEmpty(rawPhotos)}"
                    >
                      <th:block
                        th:with="fbResult=${photoFinder.list(1, 1, album.metadata.name)}"
                      >
                        <th:block th:with="fbPhotos=${fbResult.items}">
                          <img
                            th:if="${not #lists.isEmpty(fbPhotos)}"
                            th:src="${fbPhotos[0].spec.cover != null and !#strings.isEmpty(fbPhotos[0].spec.cover) ? fbPhotos[0].spec.cover : fbPhotos[0].spec.url}"
                            th:alt="${album.spec.displayName}"
                            loading="lazy"
                          />
                        </th:block>
                      </th:block>
                    </th:block>
                  </th:block>
                  <th:block
                    th:if="${not #lists.isEmpty(theme.config?.photos?.album_covers)}"
                  >
                    <img
                      class="album-cover-custom"
                      th:each="cv : ${theme.config.photos.album_covers}"
                      th:if="${cv != null and cv.group == album.spec.displayName and not #strings.isEmpty(cv.cover)}"
                      th:src="${cv.cover}"
                      th:alt="${album.spec.displayName}"
                      loading="lazy"
                    />
                  </th:block>
                </span>
                <p
                  class="albums-card__name"
                  th:text="${album.spec.displayName}"
                >
                  相册
                </p>
                <p
                  class="albums-card__count"
                  th:if="${album.status != null and album.status.photoCount != null}"
                  th:text="#{photos.photo_count(${album.status.photoCount})}"
                >
                  12 张照片
                </p>
                <span class="albums-card__more">查看相册 →</span>
              </a>
            </li>
          </ul>
          <p class="photos-empty" th:if="${#lists.isEmpty(albums)}" role="status">
            暂无相册
          </p>
        </th:block>
      </th:block>

      <!-- 相册内瀑布流视图 -->
      <th:block th:unless="${#strings.isEmpty(group)}">
        <div class="photos-toolbar" th:if="${not #lists.isEmpty(photos.items)}">
          <button
            class="photos-preview-toggle"
            id="photos-preview-toggle"
            type="button"
            th:attr="data-default=${theme.config?.photos?.preview_default != false ? 'on' : 'off'}"
          >
            预览模式
          </button>
        </div>

        <ul
          class="photos-masonry"
          th:if="${not #lists.isEmpty(photos.items)}"
          th:attr="data-lightbox=${theme.config?.basic?.enable_lightbox != false ? 'true' : null}"
        >
          <li th:each="photo : ${photos.items}">
            <a
              class="photos-card__media"
              th:href="${photoUrl.detail(photo)}"
              th:title="${photo.spec.displayName}"
            >
              <img
                th:src="${#strings.isEmpty(photo.spec.cover) ? photo.spec.url : photo.spec.cover}"
                th:alt="${photo.spec.displayName}"
                loading="lazy"
              />
            </a>
            <p
              class="photos-card__caption"
              th:if="${not #strings.isEmpty(photo.spec.displayName)}"
              th:text="${photo.spec.displayName}"
            >
              照片
            </p>
          </li>
        </ul>
        <p
          class="photos-empty"
          th:if="${#lists.isEmpty(photos.items)}"
          role="status"
        >
          暂无照片
        </p>

        <nav
          class="photos-pagination"
          th:if="${photos.hasPrevious() || photos.hasNext()}"
          aria-label="分页"
        >
          <a
            class="photos-pagination__previous"
            th:if="${photos.hasPrevious()}"
            th:href="${photos.prevUrl}"
            >上一页</a
          >
          <span class="photos-pagination__status">
            第 <strong th:text="${photos.page}">1</strong> 页，共
            <strong th:text="${photos.totalPages}">1</strong> 页
          </span>
          <a
            class="photos-pagination__next"
            th:if="${photos.hasNext()}"
            th:href="${photos.nextUrl}"
            >下一页</a
          >
        </nav>
      </th:block>
    </section>
  </div>

  <script th:inline="none">
    (function () {
      var btn = document.getElementById("photos-preview-toggle");
      var masonry = document.querySelector(".photos-masonry");
      if (!btn || !masonry) return;

      var KEY = "whitespace-photo-preview";
      var defaultOn = btn.getAttribute("data-default") === "on";
      var stored = null;
      try {
        stored = localStorage.getItem(KEY);
      } catch (e) {
        /* ignore */
      }
      var mode = stored === null ? defaultOn : stored === "on";

      function apply() {
        if (mode) {
          masonry.setAttribute("data-lightbox", "true");
        } else {
          masonry.removeAttribute("data-lightbox");
        }
        btn.textContent = mode ? "预览模式：开" : "预览模式：关";
        btn.setAttribute("aria-pressed", mode ? "true" : "false");
      }

      btn.addEventListener("click", function () {
        mode = !mode;
        try {
          localStorage.setItem(KEY, mode ? "on" : "off");
        } catch (e) {
          /* ignore */
        }
        // 重新加载以按新模式初始化灯箱
        window.location.reload();
      });

      apply();
    })();
  </script>
</include>
