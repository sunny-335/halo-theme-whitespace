<include src="partials/layout.html">
  <template name="head">
    <title th:text="|${title} - ${site.title}|">图库</title>
    <style>
      /* 图库页面适当加宽 */
      .container {
        max-width: 75rem;
      }

      /* 分组导航（图库标题下方） */
      :where(.photos-nav) {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.6rem;
        margin: 1.25rem 0 0;
      }
      :where(.photos-nav button) {
        padding: 0.3rem 1rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        background: var(--color-bg-secondary);
        color: var(--color-text-secondary);
        font: inherit;
        font-size: 0.88rem;
        cursor: pointer;
        transition:
          color var(--transition-fast),
          border-color var(--transition-fast),
          background var(--transition-fast);
      }
      :where(.photos-nav button:hover) {
        color: var(--color-primary);
        border-color: var(--color-primary);
      }
      :where(.photos-nav button.is-active) {
        color: #fff;
        border-color: var(--color-primary);
        background: var(--color-primary);
      }

      /* 分组区块 */
      :where(.photos-group)[hidden] {
        display: none;
      }
      :where(.photos-group-title) {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 2rem 0 0;
        font-size: 1.05rem;
        font-weight: 600;
      }
      :where(.photos-group-title::before) {
        content: "";
        width: 0.2rem;
        height: 1.1em;
        border-radius: 2px;
        background: var(--color-primary);
      }
      :where(.photos-group-section:first-of-type .photos-group-title) {
        margin-top: 1.5rem;
      }

      /* 瀑布流（一行三张，图片自适应原比例） */
      :where(.photos-masonry) {
        list-style: none;
        margin: 1rem 0 0;
        padding: 0;
        columns: 3;
        column-gap: 1rem;
      }
      :where(.photos-masonry > li) {
        break-inside: avoid;
        margin: 0 0 1rem;
      }
      :where(.photos-item) {
        display: block;
      }
      :where(.photos-item img) {
        display: block;
        width: 100%;
        height: auto;
        border-radius: var(--radius-md);
        background: var(--color-bg-secondary);
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      :where(.photos-item img.is-loaded) {
        opacity: 1;
      }
      @media (max-width: 900px) {
        :where(.photos-masonry) {
          columns: 2;
        }
      }
      @media (max-width: 560px) {
        :where(.photos-masonry) {
          columns: 1;
        }
      }

      :where(.photos-empty) {
        color: var(--color-text-muted);
        padding: 2rem 0;
        text-align: center;
      }
    </style>
  </template>

  <div class="container">
    <section class="photos-page">
      <header class="photos-header">
        <h1 class="photos-header__title" th:text="${title}">图库</h1>
      </header>

      <th:block
        th:with="albums=${photoFinder.groupBy()}, anyCheck=${photoFinder.list(1, 1)}, anyPhotos=${anyCheck != null ? anyCheck.items : null}"
      >
        <!-- 分组导航 -->
        <nav
          class="photos-nav"
          id="photos-nav"
          aria-label="图库分组"
          th:if="${not #lists.isEmpty(albums)}"
        >
          <button type="button" class="is-active" data-group="">全部</button>
          <button
            type="button"
            th:each="album : ${albums}"
            th:attr="data-group=${album.metadata.name}"
            th:text="${album.spec.displayName}"
          >
            分组
          </button>
        </nav>

        <!-- 各分组照片，一次全部渲染；默认「全部」视图，前台脚本切换 -->
        <th:block th:if="${not #lists.isEmpty(albums)}">
          <section
            class="photos-group-section"
            th:each="album : ${albums}"
            th:attr="data-group=${album.metadata.name}"
          >
            <h2 class="photos-group-title" th:text="${album.spec.displayName}">
              分组
            </h2>
            <th:block th:with="rawPhotos=${album.photos}">
              <th:block
                th:with="photos=${(rawPhotos != null and !#lists.isEmpty(rawPhotos)) ? rawPhotos : photoFinder.listBy(album.metadata.name)}"
              >
                <ul
                  class="photos-masonry"
                  th:if="${not #lists.isEmpty(photos)}"
                  th:attr="data-lightbox=${theme.config?.basic?.enable_lightbox != false ? 'true' : null}"
                >
                  <li th:each="photo : ${photos}">
                    <a
                      class="photos-item"
                      th:href="${photoUrl.detail(photo)}"
                      th:title="${photo.spec.displayName}"
                    >
                      <img
                        th:src="${#strings.isEmpty(photo.spec.cover) ? photo.spec.url : photo.spec.cover}"
                        th:alt="${photo.spec.displayName}"
                        loading="lazy"
                        decoding="async"
                      />
                    </a>
                  </li>
                </ul>
              </th:block>
            </th:block>
          </section>

          <p
            class="photos-empty"
            th:if="${#lists.isEmpty(anyPhotos)}"
            role="status"
          >
            暂无照片
          </p>
        </th:block>
      </th:block>
    </section>
  </div>

  <script th:inline="none">
    (function () {
      var nav = document.getElementById("photos-nav");
      if (!nav) return;

      var sections = document.querySelectorAll(".photos-group-section");
      var buttons = nav.querySelectorAll("button");

      // 深链接：?group=xxx（仅前台读取，不依赖服务端参数）
      var initial = "";
      try {
        initial = new URLSearchParams(window.location.search).get("group") || "";
      } catch (e) {
        initial = "";
      }

      function apply(group) {
        Array.prototype.forEach.call(buttons, function (btn) {
          var active = btn.getAttribute("data-group") === group;
          btn.classList.toggle("is-active", active);
        });
        Array.prototype.forEach.call(sections, function (sec) {
          var match = group === "" || sec.getAttribute("data-group") === group;
          if (match) {
            sec.removeAttribute("hidden");
          } else {
            sec.setAttribute("hidden", "");
          }
        });
      }

      nav.addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-group]");
        if (!btn) return;
        apply(btn.getAttribute("data-group"));
      });

      if (initial && nav.querySelector('button[data-group="' + initial + '"]')) {
        apply(initial);
      }

      // 图片加载后淡入
      Array.prototype.forEach.call(
        document.querySelectorAll(".photos-item img"),
        function (img) {
          if (img.complete && img.naturalWidth > 0) {
            img.classList.add("is-loaded");
          } else {
            img.addEventListener("load", function () {
              img.classList.add("is-loaded");
            });
          }
        },
      );
    })();
  </script>
</include>
