<include src="partials/layout.html">
  <template name="head">
    <title th:text="|${title} - ${site.title}|">图库</title>
    <style>
      /* 图库页面适当加宽 */
      .container {
        max-width: 75rem;
      }

      /* 相册内视图工具条 */
      :where(.photos-toolbar) {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1rem;
      }
      :where(.photos-back) {
        color: var(--color-link);
        font-size: 0.9rem;
      }
      :where(.photos-back):hover {
        color: var(--color-link-hover);
      }
      :where(.photos-album-title) {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
        flex: 1 1 auto;
      }

      /* 相册网格 */
      :where(.albums-grid) {
        list-style: none;
        margin: 1.5rem 0 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(
          auto-fill,
          minmax(min(16rem, 100%), 1fr)
        );
        gap: 1.5rem;
      }
      /* 打开某个相册后：只显示该相册，卡片收起、瀑布流展开 */
      :where(.albums-grid.is-album-open) {
        display: block;
      }
      :where(.albums-grid.is-album-open .albums-item) {
        display: none;
      }
      :where(.albums-grid.is-album-open .albums-item.is-active) {
        display: block;
      }
      :where(.albums-item.is-active .albums-card) {
        display: none;
      }

      :where(.albums-card) {
        display: block;
        color: var(--color-text);
      }
      :where(.albums-card:hover .albums-card__name) {
        color: var(--color-primary);
      }
      :where(.albums-card__cover) {
        display: block;
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border-radius: var(--radius-md);
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border);
      }
      :where(.albums-card__cover img) {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      :where(.albums-card__cover img.album-cover-custom) {
        z-index: 1;
      }
      :where(.albums-card__name) {
        margin: 0.75rem 0 0;
        font-size: 1rem;
        font-weight: 600;
      }
      :where(.albums-card__count) {
        margin: 0.25rem 0 0;
        font-size: 0.85rem;
        color: var(--color-text-muted);
      }
      :where(.albums-card__more) {
        display: inline-block;
        margin-top: 0.4rem;
        font-size: 0.8rem;
        color: var(--color-primary);
        opacity: 0;
        transform: translateX(-0.25rem);
        transition: opacity var(--transition-fast), transform var(--transition-fast);
      }
      :where(.albums-card:hover .albums-card__more) {
        opacity: 1;
        transform: translateX(0);
      }

      /* 瀑布流（一行三张） */
      :where(.photos-masonry) {
        list-style: none;
        margin: 1.5rem 0 0;
        padding: 0;
        columns: 3;
        column-gap: 1rem;
      }
      :where(.photos-masonry[hidden]) {
        display: none;
      }
      :where(.photos-masonry > li) {
        break-inside: avoid;
        margin: 0 0 1rem;
      }
      :where(.photos-masonry .photos-card__media) {
        display: block;
      }
      :where(.photos-masonry img) {
        display: block;
        width: 100%;
        height: auto;
        border-radius: var(--radius-md);
        background: var(--color-bg-secondary);
      }
      :where(.photos-masonry .photos-card__caption) {
        margin: 0.4rem 0 0;
        font-size: 0.85rem;
        color: var(--color-text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (max-width: 900px) {
        :where(.photos-masonry) {
          columns: 2;
        }
      }
      @media (max-width: 560px) {
        :where(.photos-masonry) {
          columns: 1;
        }
      }

      /* 预览模式切换 */
      :where(.photos-preview-toggle) {
        padding: 0.4rem 0.9rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background: var(--color-bg-secondary);
        color: var(--color-text);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      :where(.photos-preview-toggle)[aria-pressed="true"] {
        border-color: var(--color-primary);
        color: var(--color-primary);
      }

      :where(.photos-empty) {
        color: var(--color-text-muted);
        padding: 2rem 0;
      }
    </style>
  </template>

  <div class="container">
    <section class="photos-page">
      <header class="photos-header">
        <h1 class="photos-header__title" th:text="${title}">图库</h1>
      </header>

      <!-- 相册内视图工具条：打开具体相册时显示 -->
      <div class="photos-toolbar" id="photos-toolbar" hidden>
        <a
          class="photos-back"
          th:href="${photoUrl != null ? photoUrl.list() : '/photos'}"
          th:text="#{photos.back}"
          >返回全部相册</a
        >
        <h2 class="photos-album-title" id="photos-album-title"></h2>
        <button
          class="photos-preview-toggle"
          id="photos-preview-toggle"
          type="button"
          th:attr="data-default=${theme.config?.photos?.preview_default != false ? 'on' : 'off'},data-global=${theme.config?.basic?.enable_lightbox != false ? '1' : '0'}"
        >
          预览模式
        </button>
      </div>

      <th:block th:with="albums=${photoFinder.groupBy()}">
        <ul
          class="albums-grid"
          id="albums-grid"
          th:if="${not #lists.isEmpty(albums)}"
        >
          <li
            class="albums-item"
            th:each="album : ${albums}"
            th:attr="data-album=${album.metadata.name}"
            th:data-title="${album.spec.displayName}"
          >
            <th:block th:with="rawPhotos=${album.photos}">
              <th:block
                th:with="albumPhotos=${(rawPhotos != null and !#lists.isEmpty(rawPhotos)) ? rawPhotos : photoFinder.listBy(album.metadata.name)}"
              >
                <a
                  class="albums-card"
                  th:href="${photoUrl.list(album.metadata.name)}"
                  th:aria-label="|查看相册 ${album.spec.displayName}|"
                  th:title="|查看相册 ${album.spec.displayName}|"
                >
                  <span class="albums-card__cover">
                    <img
                      th:if="${not #lists.isEmpty(albumPhotos)}"
                      th:src="${albumPhotos[0].spec.cover != null and !#strings.isEmpty(albumPhotos[0].spec.cover) ? albumPhotos[0].spec.cover : albumPhotos[0].spec.url}"
                      th:alt="${album.spec.displayName}"
                      loading="lazy"
                    />
                    <th:block
                      th:if="${not #lists.isEmpty(theme.config?.photos?.album_covers)}"
                    >
                      <img
                        class="album-cover-custom"
                        th:each="cv : ${theme.config.photos.album_covers}"
                        th:if="${cv != null and cv.group == album.metadata.name and not #strings.isEmpty(cv.cover)}"
                        th:src="${cv.cover}"
                        th:alt="${album.spec.displayName}"
                        loading="lazy"
                      />
                    </th:block>
                  </span>
                  <p class="albums-card__name" th:text="${album.spec.displayName}">
                    相册
                  </p>
                  <p
                    class="albums-card__count"
                    th:if="${album.status != null and album.status.photoCount != null}"
                    th:text="#{photos.photo_count(${album.status.photoCount})}"
                  >
                    12 张照片
                  </p>
                  <span class="albums-card__more">查看相册 →</span>
                </a>

                <!-- 该相册的照片瀑布流：默认隐藏，由脚本按 URL 的 group 显示 -->
                <ul
                  class="photos-masonry"
                  hidden
                  th:attr="data-lightbox=${theme.config?.basic?.enable_lightbox != false ? 'true' : null}"
                >
                  <li th:each="photo : ${albumPhotos}">
                    <a
                      class="photos-card__media"
                      th:href="${photoUrl.detail(photo)}"
                      th:title="${photo.spec.displayName}"
                    >
                      <img
                        th:src="${#strings.isEmpty(photo.spec.cover) ? photo.spec.url : photo.spec.cover}"
                        th:alt="${photo.spec.displayName}"
                        loading="lazy"
                      />
                    </a>
                    <p
                      class="photos-card__caption"
                      th:if="${not #strings.isEmpty(photo.spec.displayName)}"
                      th:text="${photo.spec.displayName}"
                    >
                      照片
                    </p>
                  </li>
                </ul>
              </th:block>
            </th:block>
          </li>
        </ul>
        <p class="photos-empty" th:if="${#lists.isEmpty(albums)}" role="status">
          暂无相册
        </p>
      </th:block>
    </section>
  </div>

  <script th:inline="none">
    (function () {
      var grid = document.getElementById("albums-grid");
      if (!grid) return;

      var toolbar = document.getElementById("photos-toolbar");
      var titleEl = document.getElementById("photos-album-title");

      // 按 URL 上的 group 参数决定显示哪个相册
      //（不依赖服务端 group 变量，避免页面缓存 / 插件版本差异导致打不开相册）
      var group = "";
      try {
        group = new URLSearchParams(window.location.search).get("group") || "";
      } catch (e) {
        group = "";
      }

      var items = grid.querySelectorAll(".albums-item");
      var opened = false;

      Array.prototype.forEach.call(items, function (item) {
        var masonry = item.querySelector(".photos-masonry");
        var isMatch = group !== "" && item.getAttribute("data-album") === group;
        if (isMatch) {
          item.classList.add("is-active");
          if (masonry) masonry.removeAttribute("hidden");
          if (titleEl) titleEl.textContent = item.getAttribute("data-title") || "";
          opened = true;
        } else {
          item.classList.remove("is-active");
          if (masonry) masonry.setAttribute("hidden", "");
        }
      });

      if (opened) {
        grid.classList.add("is-album-open");
        if (toolbar) toolbar.removeAttribute("hidden");
      } else {
        grid.classList.remove("is-album-open");
        if (toolbar) toolbar.setAttribute("hidden", "");
      }

      // 预览模式（作用于全部相册瀑布流）
      var btn = document.getElementById("photos-preview-toggle");
      if (!btn) return;

      var KEY = "whitespace-photo-preview";
      var defaultOn = btn.getAttribute("data-default") === "on";
      var globalOn = btn.getAttribute("data-global") === "1";
      var stored = null;
      try {
        stored = localStorage.getItem(KEY);
      } catch (e) {
        /* ignore */
      }
      var mode = stored === null ? defaultOn : stored === "on";

      function apply() {
        var all = document.querySelectorAll(".photos-masonry");
        Array.prototype.forEach.call(all, function (m) {
          if (globalOn && mode) {
            m.setAttribute("data-lightbox", "true");
          } else {
            m.removeAttribute("data-lightbox");
          }
        });
        btn.textContent = mode ? "预览模式：开" : "预览模式：关";
        btn.setAttribute("aria-pressed", mode ? "true" : "false");
      }

      btn.addEventListener("click", function () {
        mode = !mode;
        try {
          localStorage.setItem(KEY, mode ? "on" : "off");
        } catch (e) {
          /* ignore */
        }
        // 重新加载，使灯箱按新模式初始化
        window.location.reload();
      });

      apply();
    })();
  </script>
</include>
