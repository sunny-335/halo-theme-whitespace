<include src="partials/layout.html">
  <template name="head">
    <title th:text="|${tag.spec.displayName} - ${site.title}|">Tag</title>
    <th:block
      th:with="seoTitle=${tag.spec.displayName}, seoUrl=${site.url + tag.status.permalink}, seoDesc=null, seoImage=${tag.spec.cover ?: site.logo}, seoType='website'"
    >
      <include src="seo.html"></include>
    </th:block>
  </template>

  <div class="container">
    <!-- 标签标题 -->
    <div class="category-header">
      <h1 class="category-title" th:text="${tag.spec.displayName}">Tag</h1>
    </div>

    <!-- 文章列表 -->
    <div class="post-list" th:if="${not #lists.isEmpty(posts.items)}">
      <th:block th:each="post : ${posts.items}">
        <th:block
          th:replace="~{modules/post-card :: post-card(post=${post})}"
        ></th:block>
      </th:block>
    </div>

    <!-- 空状态 -->
    <div class="no-results" th:if="${#lists.isEmpty(posts.items)}">
      <p th:text="#{list.empty}">Nothing found here.</p>
    </div>

    <!-- 分页 -->
    <th:block
      th:replace="~{modules/pagination :: pagination(context = |${tag.status.permalink}/|, prevUrl = ${posts.prevUrl}, nextUrl = ${posts.nextUrl}, totalPages = ${posts.totalPages}, page = ${posts.page}, hasPrevious = ${posts.hasPrevious()}, hasNext = ${posts.hasNext()})}"
    ></th:block>
  </div>
</include>
