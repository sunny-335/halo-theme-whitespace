<include src="partials/layout.html">
  <template name="head">
    <title th:text="|#{tags.title} - ${site.title}|">Tags</title>
    <style>
      /* 标签云：紧凑标签片，保留间距 */
      .tag-cloud {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.65rem 0.75rem;
        margin: 1.75rem 0 0;
      }
      .tag-cloud .tag {
        display: inline-flex;
        align-items: center;
        padding: 0.35rem 0.95rem;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        background: var(--color-bg-secondary);
        color: var(--color-text-secondary);
        font-size: 0.9rem;
        line-height: 1.5;
        transition:
          color var(--transition-fast),
          border-color var(--transition-fast);
      }
      .tag-cloud .tag:hover {
        color: var(--color-primary);
        border-color: var(--color-primary);
      }
    </style>
    <th:block
      th:with="seoTitle=#{tags.title}, seoUrl=${site.url + site.routes.tagsUri}, seoDesc=null, seoImage=${site.logo}, seoType='website'"
    >
      <include src="seo.html"></include>
    </th:block>
  </template>

  <div class="container">
    <div class="category-header">
      <h1 class="category-title" th:text="#{tags.title}">Tags</h1>
    </div>

    <div class="sidebar-tags tag-cloud" th:if="${not #lists.isEmpty(tags)}">
      <a
        th:each="tag : ${tags}"
        th:href="@{${tag.status.permalink}}"
        class="tag"
        th:text="${tag.spec.displayName}"
        th:title="|${tag.postCount} #{tag.count}|"
      ></a>
    </div>

    <div class="no-results" th:if="${#lists.isEmpty(tags)}">
      <p th:text="#{list.empty}">Nothing found here.</p>
    </div>
  </div>
</include>
