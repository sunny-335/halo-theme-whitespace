<include src="partials/layout.html">
  <template name="head">
    <title th:text="|#{tags.title} - ${site.title}|">Tags</title>
    <th:block
      th:with="seoTitle=#{tags.title}, seoUrl=${site.url + site.routes.tagsUri}, seoDesc=null, seoImage=${site.logo}, seoType='website'"
    >
      <include src="seo.html"></include>
    </th:block>
  </template>

  <div class="container">
    <div class="category-header">
      <h1 class="category-title" th:text="#{tags.title}">Tags</h1>
    </div>

    <div class="sidebar-tags tag-cloud" th:if="${not #lists.isEmpty(tags)}">
      <a
        th:each="tag : ${tags}"
        th:href="@{${tag.status.permalink}}"
        class="tag"
        th:text="${tag.spec.displayName}"
        th:title="${tag.postCount != null ? tag.postCount + ' ' + #{'tag.count'} : ''}"
      ></a>
    </div>

    <div class="no-results" th:if="${#lists.isEmpty(tags)}">
      <p th:text="#{list.empty}">Nothing found here.</p>
    </div>
  </div>
</include>
