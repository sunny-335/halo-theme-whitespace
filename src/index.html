<include src="partials/layout.html">
  <template name="head">
    <title th:text="${site.title}">Site Title</title>
    <th:block
      th:with="seoTitle=${site.title}, seoUrl=${site.url}, seoDesc=null, seoImage=${site.logo}, seoType='website'"
    >
      <include src="seo.html"></include>
    </th:block>
  </template>

  <div class="container">
    <!-- 置顶文章：首页第一页时展示最新一篇置顶文章 -->
    <th:block
      th:if="${theme.config?.featured?.enable != null and theme.config.featured.enable and posts.first}"
      th:with="featuredList = ${postFinder.list({'pinned': true, 'size': 1})}"
    >
      <th:block
        th:if="${featuredList != null and not #lists.isEmpty(featuredList.items)}"
        th:with="featured = ${featuredList.items[0]}"
      >
        <article class="post post-featured">
          <h2 class="post-title">
            <a th:href="@{${featured.status.permalink}}"
               th:text="${featured.spec.title}">Featured post</a>
          </h2>
          <p
            class="post-excerpt"
            th:if="${not #strings.isEmpty(featured.status.excerpt)}"
            th:text="${featured.status.excerpt}"
          ></p>
          <th:block
            th:replace="~{modules/post-meta :: post-meta(post=${featured}, dateClass='post-date')}"
          ></th:block>
        </article>
      </th:block>
    </th:block>

    <!-- 文章列表 -->
    <div
      class="post-list"
      th:if="${not #lists.isEmpty(posts.items)}"
      th:with="postList = ${posts.items}"
    >
      <th:block th:each="post : ${postList}">
        <th:block
          th:replace="~{modules/post-card :: post-card(post=${post})}"
        ></th:block>
      </th:block>
    </div>

    <!-- 空状态 -->
    <div class="no-results" th:if="${#lists.isEmpty(posts.items)}">
      <p th:text="#{list.empty}">Nothing found here.</p>
    </div>

    <!-- 分页 -->
    <th:block
      th:replace="~{modules/pagination :: pagination(context = '/', prevUrl = ${posts.prevUrl}, nextUrl = ${posts.nextUrl}, totalPages = ${posts.totalPages}, page = ${posts.page}, hasPrevious = ${posts.hasPrevious()}, hasNext = ${posts.hasNext()})}"
    ></th:block>
  </div>
</include>
