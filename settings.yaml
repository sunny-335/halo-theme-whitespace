apiVersion: v1alpha1
kind: Setting
metadata:
  name: whitespace-setting
spec:
  forms:
    - group: basic
      label: 基础
      formSchema:
        - $formkit: radio
          name: color_scheme
          label: 默认配色
          value: system
          help: 首次访问时使用的配色，访客手动切换后以访客选择为准
          options:
            - label: 跟随系统
              value: system
            - label: 浅色
              value: light
            - label: 深色
              value: dark
        - $formkit: textarea
          name: footer_copyright
          label: 自定义版权信息
          value: ""
          placeholder: 支持编写 HTML，留空则不显示
          help: 显示在页脚的自定义版权信息
        - $formkit: checkbox
          name: show_theme_credit
          label: 显示主题署名
          value: true
          help: 在页脚显示「Theme by」署名；关闭则不显示
        - $formkit: text
          name: theme_credit_text
          label: 署名名称
          value: "WhiteSpace"
          placeholder: 显示在「Theme by」之后的名称
          help: 页脚主题署名的展示名称
        - $formkit: text
          name: theme_credit_url
          label: 署名链接
          value: "https://git.nxxy335.top/nxxy335/halo-theme-whitespace"
          placeholder: 点击署名跳转的地址
          help: 页脚「Theme by」署名的跳转链接，默认主题仓库地址
        - $formkit: checkbox
          name: show_word_count
          label: 文章卡片显示字数
          value: true
          help: 在文章卡片与置顶文章上展示字数及阅读时长（需 extra-api 插件提供数据）
    - group: featured
      label: 置顶文章
      formSchema:
        - $formkit: checkbox
          name: enable
          label: 首页展示置顶文章
          value: true
          help: 在首页顶部以大标题样式展示最新的一篇置顶文章（需在文章设置中开启置顶）
    - group: about
      label: 关于页面
      formSchema:
        - $formkit: attachment
          name: avatar
          label: 博主头像
          value: ""
          help: 关于页面展示的头像，留空则使用站点 Logo
        - $formkit: textarea
          name: bio
          label: 个人简介
          value: "一个热爱生活、热爱技术的普通人"
          help: 关于页面头像下方显示的简介
        - $formkit: text
          name: github_url
          label: GitHub 链接
          value: ""
          placeholder: https://github.com/yourname
        - $formkit: text
          name: twitter_url
          label: Twitter 链接
          value: ""
          placeholder: https://x.com/yourname
        - $formkit: text
          name: contact_email
          label: 联系邮箱
          value: ""
          placeholder: mail@example.com
    - group: seo
      label: SEO
      formSchema:
        - $formkit: checkbox
          name: enable_metadata
          label: 输出 canonical 和社交分享标签
          value: true
          help: 输出 canonical、Open Graph 与 Twitter Card 标签；若已由插件提供，请关闭以避免重复
        - $formkit: checkbox
          name: enable_structured_data
          label: 输出文章结构化数据
          value: true
          help: 在文章页输出 Schema.org BlogPosting JSON-LD；若已由插件提供，请关闭
    - group: footer
      label: 页脚备案
      formSchema:
        - $formkit: text
          name: icp_number
          label: ICP 备案号
          value: ""
          placeholder: 京ICP备12345678号
          help: 工信部备案号，留空则不显示
        - $formkit: text
          name: icp_url
          label: ICP 备案查询链接
          value: "https://beian.miit.gov.cn"
          help: 点击备案号跳转的查询地址，默认工信部备案管理系统
        - $formkit: text
          name: police_number
          label: 公网安备号
          value: ""
          placeholder: 京公网安备11000002000001号
          help: 公安机关备案号，留空则不显示
        - $formkit: text
          name: police_url
          label: 公网安备查询链接
          value: "https://beian.mps.gov.cn"
          help: 点击公网安备号跳转的地址，默认全国互联网安全管理服务平台
    - group: stats
      label: 全站数据
      formSchema:
        - $formkit: checkbox
          name: enable
          label: 显示全站数据统计
          value: false
          help: 在页脚展示站点文章、分类、评论、访问量与字数等统计
        - $formkit: checkbox
          name: show_posts
          label: 文章数
          value: true
        - $formkit: checkbox
          name: show_categories
          label: 分类数
          value: true
        - $formkit: checkbox
          name: show_tags
          label: 标签数
          value: false
        - $formkit: checkbox
          name: show_comments
          label: 评论数
          value: true
        - $formkit: checkbox
          name: show_visits
          label: 访问量
          value: true
        - $formkit: checkbox
          name: show_words
          label: 全站总字数（需 extra-api 插件）
          value: true
